  <aside class="carrito-panel">
  <h2>Tu carrito</h2>
  <ul class="carrito-lista" id="carritoLista">
    <!-- Los productos agregados aparecerán aquí -->
  </ul>
  <li><a href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li>


  <button class="btn-comprar">Comprar</button>

  </main>

  <!-- SCRIPT JS -->
  <script>
    const carritoLista = document.getElementById("carritoLista");

    document.querySelectorAll(".agregar-btn").forEach(boton => {
      boton.addEventListener("click", () => {
        const card = boton.closest(".producto-card");
        const titulo = card.querySelector(".titulo").innerText;
        const cantidad = parseInt(card.querySelector("input").value);
        const precio = parseFloat(card.querySelector(".precio").dataset.precio);

        const existente = [...carritoLista.children].find(li =>
          li.dataset.producto === titulo
        );

        if (existente) {
          const cantidadActual = parseInt(existente.dataset.cantidad);
          const nuevaCantidad = cantidadActual + cantidad;
          existente.dataset.cantidad = nuevaCantidad;
          existente.innerText = `${titulo} × ${nuevaCantidad} = $${(precio * nuevaCantidad).toFixed(2)} MXN`;
        } else {
          const li = document.createElement("li");
          li.dataset.producto = titulo;
          li.dataset.cantidad = cantidad;
          li.innerText = `${titulo} × ${cantidad} = $${(precio * cantidad).toFixed(2)} MXN`;
          carritoLista.appendChild(li);
        }
      });
    });

    // Botones + y -
    document.querySelectorAll(".mas").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = btn.parentElement.querySelector("input");
        input.value = parseInt(input.value) + 1;
      });
    });

    document.querySelectorAll(".menos").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = btn.parentElement.querySelector("input");
        if (parseInt(input.value) > 1) {
          input.value = parseInt(input.value) - 1;
        }
      });
    });

    function cerrarSesion() {
  localStorage.removeItem("usuarioLogeado");
  window.location.href = "index.html";
}

  </script>
